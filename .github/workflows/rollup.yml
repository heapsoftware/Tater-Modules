name: rollup

# Keeps the master manifest(s) in sync with the source repos automatically.
# - schedule: every 30 min (covers the ~5 min raw-CDN lag after source pushes)
# - workflow_dispatch: run on demand from the Actions tab
# - repository_dispatch: fired by the optional per-source-repo dispatcher
#   (see README, "Auto rollup" section)
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  repository_dispatch:

permissions:
  contents: write

jobs:
  rollup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # A failed build is usually transient: the raw CDN lags source pushes by
      # up to ~5 min, or a source repo is mid-release. Retry before giving up.
      - name: Build and verify
        run: |
          set -e
          for attempt in 1 2 3 4 5 6; do
            if python3 build_manifest.py --check-only && python3 build_manifest.py; then
              echo "build succeeded (attempt $attempt)"
              exit 0
            fi
            echo "::warning::build failed (attempt $attempt of 6); retrying in 60 s"
            sleep 60
          done
          python3 build_manifest.py --check-only

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "manifests unchanged; nothing to do"
            exit 0
          fi
          git add -u
          git commit -m "Roll up source manifests" \
            -m "Regenerated by build_manifest.py (auto rollup).

Co-Authored-By: Claude Code <noreply@anthropic.com>"
          git push
